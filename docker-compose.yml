services:
  db:
    image: postgres:16-alpine
    container_name: protracker-db
    restart: unless-stopped
    ports:
     - "55432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protracker}
      POSTGRES_USER: ${POSTGRES_USER:-protracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protracker_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protracker} -d ${POSTGRES_DB:-protracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - protracker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protracker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - protracker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protracker-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - protracker-network

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  protracker-network:
    driver: bridge